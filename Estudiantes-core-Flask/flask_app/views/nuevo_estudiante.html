<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo Estudiante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary min-vh-100">
    <div class="container-sm py-5">

        
        <div class="card bg-body border-secondary-subtle mb-4 shadow-sm">
            <div class="card-body p-4">
                <h2 class="h5 mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-person-plus text-primary"></i>
                    Nuevo Estudiante
                </h2>
                <form action="/crear/estudiante" method="post" class="row g-3">
                    <div class="col-12">
                        <label for="curso_id" class="form-label small text-body-secondary">Curso</label>
                        <select name="curso_id" id="curso_id" class="form-select" required>
                            {% for curso in todos_cursos %}
                            <option value="{{curso.id}}">{{curso.nombre}}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="nombre" class="form-label small text-body-secondary">Nombre</label>
                        <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Ej. Juan" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="apellido" class="form-label small text-body-secondary">Apellido</label>
                        <input type="text" name="apellido" id="apellido" class="form-control" placeholder="Ej. Pérez" required>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="edad" class="form-label small text-body-secondary">Edad</label>
                        <input type="number" name="edad" id="edad" class="form-control" placeholder="Ej. 20" min="1" required>
                    </div>

                    <div class="col-12 d-flex justify-content-end mt-2">
                        <button type="submit" class="btn btn-success d-inline-flex align-items-center gap-2">
                            <i class="bi bi-check2"></i> Crear
                        </button>
                    </div>
                </form>
            </div>
        </div>

        
        <div class="text-center">
            <a href="/" class="btn btn-outline-light d-inline-flex align-items-center gap-2">
                <i class="bi bi-arrow-left"></i> Inicio
            </a>
        </div>

    </div>
   
</body>
</html>
