<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estudiantes de {{curso.nombre}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary min-vh-100">
    <div class="container-sm py-5">

       
        <div class="card bg-body border-secondary-subtle mb-4 shadow-sm">
            <div class="card-body p-4">
                <h2 class="h5 mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-people text-primary"></i>
                    Estudiantes de {{curso.nombre}}
                </h2>

                {% if curso.estudiantes %}
                <div class="table-responsive">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th scope="col" class="small text-body-secondary fw-normal">Nombre</th>
                                <th scope="col" class="small text-body-secondary fw-normal">Apellido</th>
                                <th scope="col" class="small text-body-secondary fw-normal">Edad</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for estudiante in curso.estudiantes %}
                            <tr>
                                <td>{{estudiante.nombre}}</td>
                                <td>{{estudiante.apellido}}</td>
                                <td>{{estudiante.edad}}</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
                {% else %}
                <p class="text-body-secondary small mb-0">Este curso aún no tiene estudiantes registrados.</p>
                {% endif %}
            </div>
        </div>

     
        <div class="text-center">
            <a href="/" class="btn btn-outline-light d-inline-flex align-items-center gap-2">
                <i class="bi bi-arrow-left"></i> Inicio
            </a>
        </div>

    </div>

</body>
</html>
