<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary min-vh-100">
    <div class="container py-5" style="max-width: 720px;">

       
        <div class="card bg-body border-secondary-subtle mb-4 shadow-sm">
            <div class="card-body p-4">
                <h2 class="h5 mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-plus-circle text-primary"></i>
                    Nuevo Curso
                </h2>
                <form action="/crear/curso" method="post" class="row g-3 align-items-end">
                    <div class="col-12 col-md-8">
                        <label for="nombre" class="form-label small text-body-secondary">Nombre del curso</label>
                        <input type="text" name="nombre" id="nombre" class="form-control" placeholder="Ej. Matemáticas I" required>
                    </div>
                    <div class="col-12 col-md-4">
                        <button type="submit" class="btn btn-success w-100 d-flex align-items-center justify-content-center gap-2">
                            <i class="bi bi-check2"></i> Crear
                        </button>
                    </div>
                </form>
            </div>
        </div>

        
        <div class="card bg-body border-secondary-subtle mb-4 shadow-sm">
            <div class="card-body p-4">
                <h2 class="h5 mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-collection text-primary"></i>
                    Todos los Cursos
                </h2>
                {% if todos_cursos %}
                <ul class="list-group list-group-flush">
                    {% for curso in todos_cursos %}
                    <li class="list-group-item bg-transparent d-flex align-items-center gap-2 px-0">
                        <i class="bi bi-book text-body-secondary"></i>
                        <a href="/cursos/{{curso.id}}" class="link-primary text-decoration-none">{{curso.nombre}}</a>
                    </li>
                    {% endfor %}
                </ul>
                {% else %}
                <p class="text-body-secondary small mb-0">Aún no hay cursos registrados.</p>
                {% endif %}
            </div>
        </div>

      
        <div class="text-center">
            <a href="/nuevo/estudiante" class="btn btn-outline-light d-inline-flex align-items-center gap-2">
                <i class="bi bi-person-plus"></i> Agregar Estudiante
            </a>
        </div>

    </div>
  
</html>
