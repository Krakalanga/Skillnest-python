<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
     href="{{ url_for('static', filename='pokemon.css') }}">

    <title>Pokedex</title>
</head>

<body>

    <h1>  <img src="{{ url_for('static', filename='images/pokebola.png') }}" alt="pokebola" style="width: 50px;"> <span>Pokédex</span></h1>
    <p class="subtitulo"> Todos los Pokémon</p>

    <div class="listar">
        <a href="/">
            Ver todos
        </a>

        <a href="/cantidad/5" class="verde">
            Ver 5 primeros
        </a>
    </div>

    <div class="container">
        

        {% for x in pokedex %}

        <div class="card">

            <header>
                <span>#{{ x.id }}</span>

                <img
                    src="{{ url_for('static', filename='images/' + x.imagen) }}"
                    alt="{{ x.nombre }}"
                >
            </header>

            <div class="info">

                <h2>{{ x.nombre }}</h2>

                <div class="tipos">
                    {% for tipo in x.tipo.split('/') %}
                        <span class="tipo {{ tipo|lower }}">
                            {{ tipo }}
                        </span>
                    {% endfor %}
                </div>


                <div class="poder">
                    <div class="poder-texto">
                        ⚡ Poder
                    </div>

                    <div class="barra">
                        <div
                            class="barra-progreso"
                            style="width: {{ x.poder / 200 * 100 }}%;"
                        ></div>
                    </div>

                    <span class="numero-poder">
                        {{ x.poder }}
                    </span>
                </div>

                <div class="datos">

                    <div>
                        <span>Altura</span>
                        <strong>{{ x.altura }}</strong>
                    </div>

                    <div>
                        <span> Peso</span>
                        <strong>{{ x.peso }}</strong>
                    </div>

                </div>

                <button>
                    Ver detalles
                </button>

            </div>

        </div>

        {% endfor %}

    </div>

</body>
</html>
