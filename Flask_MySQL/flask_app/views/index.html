<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>

    <main class="container py-5" style="max-width: 960px;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h4 fw-normal mb-0">Usuarios</h1>
            <a href="{{ url_for('usuario.nuevo') }}" class="btn btn-sm btn-dark">
                Nuevo usuario
            </a>
        </div>

        <table class="table table-borderless align-middle small">
            <thead class="border-bottom">
                <tr class="text-uppercase text-muted" style="font-size: .75rem; letter-spacing: .05em;">
                    <th class="fw-normal py-2">ID</th>
                    <th class="fw-normal py-2">Nombre</th>
                    <th class="fw-normal py-2">E-mail</th>
                    <th class="fw-normal py-2">Creado</th>
                    <th class="fw-normal py-2 text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for usuario in todos_los_usuarios %}
                <tr class="border-bottom">
                    <td class="text-muted py-3">{{ usuario.id }}</td>
                    <td class="py-3">{{ usuario.nombre }} {{ usuario.apellido }}</td>
                    <td class="text-muted py-3">{{ usuario.email }}</td>
                    <td class="text-muted py-3">{{ usuario.created_at }}</td>
                    <td class="text-end py-3">
                        <a class="link-info text-decoration-none me-3"
                           href="{{ url_for('usuario.mostrar_usuario', id=usuario.id) }}">Ver</a>
                        <a class="link-secondary text-decoration-none me-3"
                           href="{{ url_for('usuario.editar', id=usuario.id) }}">Editar</a>
                        <form action="{{ url_for('usuario.eliminar', id=usuario.id) }}"
                              method="POST"
                              onsubmit="return confirm('¿Eliminar a {{ usuario.nombre }}?');"
                              class="d-inline">
                            <button type="submit"
                                    class="btn btn-link btn-sm p-0 link-danger text-decoration-none align-baseline">
                                Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </main>

</body>
</html>
