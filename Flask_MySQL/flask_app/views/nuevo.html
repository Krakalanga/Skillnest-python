<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>

    <main class="container py-5" style="max-width: 640px;">

        <div class="mb-4">
            <a href="{{ url_for('usuario.index') }}"
               class="link-secondary text-decoration-none small">Volver</a>
            <h1 class="h4 fw-normal mt-2 mb-0">Nuevo usuario</h1>
        </div>

        <form action="{{ url_for('usuario.crear') }}" method="post">

            <div class="mb-3">
                <label for="nombre" class="form-label small text-muted">Nombre</label>
                <input type="text" name="nombre" id="nombre"
                       class="form-control border-0 border-bottom rounded-0 px-0"
                       required>
            </div>

            <div class="mb-3">
                <label for="apellido" class="form-label small text-muted">Apellido</label>
                <input type="text" name="apellido" id="apellido"
                       class="form-control border-0 border-bottom rounded-0 px-0"
                       required>
            </div>

            <div class="mb-4">
                <label for="email" class="form-label small text-muted">E-mail</label>
                <input type="email" name="email" id="email"
                       class="form-control border-0 border-bottom rounded-0 px-0"
                       required>
            </div>

            <div class="d-flex gap-3 align-items-center">
                <button type="submit" class="btn btn-sm btn-dark px-4">Crear</button>
                <a href="{{ url_for('usuario.index') }}"
                   class="link-secondary text-decoration-none small">Cancelar</a>
            </div>

        </form>

    </main>

</body>
</html>
