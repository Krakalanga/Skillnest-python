<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body>

    <main class="container py-5" style="max-width: 640px;">

        <div class="mb-4">
            <a href="{{ url_for('usuario.index') }}"
               class="link-secondary text-decoration-none small">← Volver</a>
            <h1 class="h4 fw-normal mt-2 mb-0">Detalle de usuario</h1>
            <p class="text-muted small mb-0">ID {{ usuario.id }}</p>
        </div>

        <dl class="row small mb-4">
            <dt class="col-4 text-muted fw-normal py-2 border-bottom">Nombre completo</dt>
            <dd class="col-8 py-2 border-bottom mb-0">{{ usuario.nombre }} {{ usuario.apellido }}</dd>

            <dt class="col-4 text-muted fw-normal py-2 border-bottom">E-mail</dt>
            <dd class="col-8 py-2 border-bottom mb-0">{{ usuario.email }}</dd>

            <dt class="col-4 text-muted fw-normal py-2 border-bottom">Fecha de creación</dt>
            <dd class="col-8 py-2 border-bottom mb-0">{{ usuario.created_at }}</dd>
        </dl>

        <div class="d-flex gap-3 align-items-center">
            <a class="btn btn-sm btn-dark px-4"
               href="{{ url_for('usuario.editar', id=usuario.id) }}">Editar</a>
            <form action="{{ url_for('usuario.eliminar', id=usuario.id) }}"
                  method="POST"
                  onsubmit="return confirm('¿Eliminar a {{ usuario.nombre }}?');"
                  class="d-inline">
                <button type="submit"
                        class="btn btn-link btn-sm p-0 link-danger text-decoration-none align-baseline">
                    Eliminar
                </button>
            </form>
            <a href="{{ url_for('usuario.index') }}"
               class="link-secondary text-decoration-none small">Cancelar</a>
        </div>

    </main>

</body>
</html>
